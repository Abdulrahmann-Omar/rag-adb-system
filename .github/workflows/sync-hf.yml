name: Sync to HuggingFace Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'app.py'
      - 'requirements.txt'
      - 'requirements_hf.txt'
      - 'README_HF.md'

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://huggingface.co/spaces/${{ vars.HF_SPACE_NAME }} || true
          git push --force hf main:main
